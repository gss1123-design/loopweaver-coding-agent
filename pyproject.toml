[project]
name = "loopweaver"
version = "0.2.0"
description = "LoopWeaver coding agent: unified LLM API, agent runtime, and Feishu integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
]

[project.optional-dependencies]
feishu = ["lark-oapi>=1.7.1"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.scripts]
loopweaver = "coding_agent.cli:main"
loopweaver-im = "im.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
